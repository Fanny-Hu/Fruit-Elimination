<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>合成水果</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root {
    --bg: #fff4e0;
    --panel: #ffe3b3;
    --ink: #5a3a1a;
    --accent: #ff7a59;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
  h1 { margin: 4px 0 8px; font-size: 22px; }
  .hud { display: flex; gap: 8px; width: 100%; max-width: 380px; margin-bottom: 8px; }
  .box { flex: 1; background: var(--panel); border-radius: 12px; padding: 6px 10px; text-align: center; }
  .box small { display: block; font-size: 12px; opacity: .7; }
  .box b { font-size: 20px; }
  #nextEmoji { font-size: 30px; line-height: 34px; }
  #wrap { position: relative; width: 100%; max-width: 380px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 14px;
    background: #fffaf0; border: 4px solid #d9a35f; touch-action: none; cursor: crosshair; }
  #overlay { position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: rgba(90, 58, 26, .72); color: #fff; border-radius: 14px; text-align: center; }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 30px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 10px 28px; font-size: 18px; cursor: pointer; }
  button:active { transform: scale(.96); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 8px; justify-content: center;
    max-width: 380px; margin-top: 10px; font-size: 13px; }
  .legend span { background: var(--panel); border-radius: 999px; padding: 2px 8px; }
  .icon-btn { padding: 4px 10px; font-size: 18px; vertical-align: middle; margin-left: 8px;
    background: var(--panel); color: var(--ink); }
  .hint { font-size: 13px; opacity: .7; margin-top: 6px; }
</style>
</head>
<body>
<h1>🍉 合成水果 <button id="mute" class="icon-btn" aria-label="音效開關">🔊</button></h1>
<div class="hud">
  <div class="box"><small>分數</small><b id="score">0</b></div>
  <div class="box"><small>最高分</small><b id="best">0</b></div>
  <div class="box"><small>下一顆</small><div id="nextEmoji">🍒</div></div>
</div>
<div id="wrap">
  <canvas id="c" width="380" height="580"></canvas>
  <div id="overlay">
    <h2>遊戲結束</h2>
    <div>最終分數：<b id="finalScore">0</b></div>
    <div id="newBest"></div>
    <button id="restart">再玩一次</button>
  </div>
</div>
<div class="legend" id="legend"></div>
<div class="hint">點擊或觸碰遊戲區，讓水果掉落；兩顆相同的水果會合成！</div>

<script>
(function () {
  // ---------- 水果設定 ----------
  const FRUITS = [
    { name: '櫻桃',   emoji: '🍒', r: 17, color: '#e53935', prob: 30, score: 1  },
    { name: '草莓',   emoji: '🍓', r: 24, color: '#ff6b81', prob: 25, score: 3  },
    { name: '葡萄',   emoji: '🍇', r: 31, color: '#9b6bd9', prob: 18, score: 6  },
    { name: '橘子',   emoji: '🍊', r: 39, color: '#ffa63d', prob: 12, score: 10 },
    { name: '蘋果',   emoji: '🍎', r: 48, color: '#ee5a4a', prob: 7,  score: 15 },
    { name: '梨子',   emoji: '🍐', r: 58, color: '#c5d94a', prob: 4,  score: 21 },
    { name: '水蜜桃', emoji: '🍑', r: 69, color: '#ffb6a3', prob: 3,  score: 28 },
    { name: '西瓜',   emoji: '🍉', r: 82, color: '#4caf50', prob: 1,  score: 50 }
  ];
  const MAX_LEVEL = FRUITS.length - 1;

  // ---------- 畫面與規則參數 ----------
  const W = 380, H = 580;
  const WALL = 20;
  const LINE_Y = 110;          // 警戒線
  const DROP_Y = 50;           // 水果出手位置
  const DROP_COOLDOWN = 450;   // 掉落冷卻 (ms)
  const SAFE_TIME = 1200;      // 掉落後多久才納入滿區判定 (ms)
  const OVER_TIME = 2000;      // 水果持續高於警戒線多久判定結束 (ms)

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const nextEl = document.getElementById('nextEmoji');
  const overlay = document.getElementById('overlay');
  const finalEl = document.getElementById('finalScore');
  const newBestEl = document.getElementById('newBest');

  // 圖例
  document.getElementById('legend').innerHTML =
    FRUITS.map(f => '<span>' + f.emoji + ' ' + f.prob + '%</span>').join('');

  // ---------- 最高分 (localStorage 可能不可用) ----------
  function loadBest() {
    try { return parseInt(localStorage.getItem('fruitMergeBest') || '0', 10) || 0; }
    catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('fruitMergeBest', String(v)); } catch (e) {}
  }

  // ---------- 物理世界 ----------
  const { Engine, World, Bodies, Body } = Matter;
  let engine, world;
  let score, best = loadBest();
  let currentLevel, nextLevel;
  let mouseX = W / 2;
  let lastDrop = 0;
  let gameOver = false;
  let overTimer = 0;
  let pendingMerges = [];
  let popEffects = [];

  bestEl.textContent = best;

  // ---------- 音效 (Web Audio 即時合成，不需要音檔) ----------
  let ac = null;
  let muted = false;
  try { muted = localStorage.getItem('fruitMergeMuted') === '1'; } catch (e) {}
  const muteBtn = document.getElementById('mute');
  muteBtn.textContent = muted ? '🔇' : '🔊';

  function getAC() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ac = new AC(); } catch (e) { return null; }
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, start, dur, type, vol, freqEnd) {
    if (muted) return;
    const c = getAC();
    if (!c) return;
    const t0 = c.currentTime + start;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(c.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }
  const sfx = {
    drop: function () { tone(420, 0, 0.12, 'sine', 0.18, 220); },
    merge: function (level) {
      // 等級越高，音越高、越豐富
      const base = 330 * Math.pow(2, level / 7);
      tone(base, 0, 0.16, 'triangle', 0.25);
      tone(base * 1.5, 0.07, 0.2, 'triangle', 0.2);
      if (level >= 4) tone(base * 2, 0.14, 0.25, 'sine', 0.18);
      if (level >= MAX_LEVEL) {
        tone(base * 2.5, 0.21, 0.3, 'sine', 0.18);
        tone(base * 3, 0.28, 0.4, 'sine', 0.16);
      }
    },
    over: function () {
      tone(392, 0, 0.25, 'sawtooth', 0.12);
      tone(330, 0.25, 0.25, 'sawtooth', 0.12);
      tone(262, 0.5, 0.45, 'sawtooth', 0.12, 200);
    }
  };
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('fruitMergeMuted', muted ? '1' : '0'); } catch (e) {}
    if (!muted) { getAC(); tone(660, 0, 0.1, 'sine', 0.15); }
  });

  function randomLevel() {
    let r = Math.random() * 100, acc = 0;
    for (let i = 0; i < FRUITS.length; i++) {
      acc += FRUITS[i].prob;
      if (r < acc) return i;
    }
    return 0;
  }

  function makeFruit(level, x, y) {
    const f = FRUITS[level];
    const body = Bodies.circle(x, y, f.r, {
      restitution: 0.15,
      friction: 0.4,
      frictionAir: 0.01,
      density: 0.001,
      label: 'fruit'
    });
    body.level = level;
    body.born = performance.now();
    body.merging = false;
    World.add(world, body);
    return body;
  }

  function addWalls() {
    const opts = { isStatic: true, friction: 0.5, label: 'wall' };
    World.add(world, [
      Bodies.rectangle(W / 2, H + WALL / 2 - 4, W + 100, WALL, opts),       // 底
      Bodies.rectangle(-WALL / 2 + 4, H / 2, WALL, H * 3, opts),            // 左
      Bodies.rectangle(W + WALL / 2 - 4, H / 2, WALL, H * 3, opts)          // 右
    ]);
  }

  function setScore(v) {
    score = v;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
    }
  }

  function updateNextUI() { nextEl.textContent = FRUITS[nextLevel].emoji; }

  function startGame() {
    engine = Engine.create({ gravity: { x: 0, y: 1.1 } });
    world = engine.world;
    addWalls();
    pendingMerges = [];
    popEffects = [];
    gameOver = false;
    overTimer = 0;
    lastDrop = 0;
    setScore(0);
    currentLevel = randomLevel();
    nextLevel = randomLevel();
    updateNextUI();
    overlay.classList.remove('show');

    Matter.Events.on(engine, 'collisionStart', function (e) {
      e.pairs.forEach(function (p) {
        const a = p.bodyA, b = p.bodyB;
        if (a.label === 'fruit' && b.label === 'fruit' &&
            a.level === b.level && !a.merging && !b.merging) {
          a.merging = true;
          b.merging = true;
          pendingMerges.push([a, b]);
        }
      });
    });
  }

  function processMerges() {
    const now = performance.now();
    pendingMerges.forEach(function (pair) {
      const a = pair[0], b = pair[1];
      const level = a.level;
      sfx.merge(level);
      const x = (a.position.x + b.position.x) / 2;
      const y = (a.position.y + b.position.y) / 2;
      World.remove(world, a);
      World.remove(world, b);
      if (level >= MAX_LEVEL) {
        // 兩顆西瓜：消除並給予大量獎勵分
        setScore(score + FRUITS[MAX_LEVEL].score * 2);
        popEffects.push({ x: x, y: y, t: now, color: FRUITS[MAX_LEVEL].color, r: FRUITS[MAX_LEVEL].r });
      } else {
        const nf = makeFruit(level + 1, x, y);
        nf.born = now - SAFE_TIME; // 合成出來的水果視為已落下
        setScore(score + FRUITS[level + 1].score);
        popEffects.push({ x: x, y: y, t: now, color: FRUITS[level + 1].color, r: FRUITS[level + 1].r });
      }
    });
    pendingMerges = [];
  }

  function checkGameOver(dt) {
    const now = performance.now();
    const bodies = Matter.Composite.allBodies(world);
    let danger = false;
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.label !== 'fruit' || b.merging) continue;
      if (now - b.born < SAFE_TIME) continue;
      const top = b.position.y - FRUITS[b.level].r;
      if (top < LINE_Y && b.speed < 0.6) { danger = true; break; }
    }
    overTimer = danger ? overTimer + dt : Math.max(0, overTimer - dt * 2);
    if (overTimer >= OVER_TIME) endGame();
  }

  function endGame() {
    gameOver = true;
    sfx.over();
    const isNew = score > 0 && score >= best && score > loadBest();
    if (score > loadBest()) saveBest(score);
    finalEl.textContent = score;
    newBestEl.textContent = isNew ? '🎉 新的最高分！' : '';
    overlay.classList.add('show');
  }

  // ---------- 輸入 ----------
  function posFromEvent(ev) {
    const rect = canvas.getBoundingClientRect();
    const cx = (ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX);
    return (cx - rect.left) * (W / rect.width);
  }
  function clampX(x, level) {
    const r = FRUITS[level].r;
    return Math.max(r + 4, Math.min(W - r - 4, x));
  }
  function drop() {
    const now = performance.now();
    if (gameOver || now - lastDrop < DROP_COOLDOWN) return;
    lastDrop = now;
    sfx.drop();
    const b = makeFruit(currentLevel, clampX(mouseX, currentLevel), DROP_Y);
    Body.setVelocity(b, { x: 0, y: 2 });
    currentLevel = nextLevel;
    nextLevel = randomLevel();
    updateNextUI();
  }

  canvas.addEventListener('mousemove', function (e) { mouseX = posFromEvent(e); });
  canvas.addEventListener('touchmove', function (e) { mouseX = posFromEvent(e); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchstart', function (e) { mouseX = posFromEvent(e); }, { passive: true });
  canvas.addEventListener('click', function (e) { mouseX = posFromEvent(e); drop(); });
  document.getElementById('restart').addEventListener('click', startGame);

  // ---------- 繪圖 ----------
  function drawFruit(x, y, level, angle, alpha) {
    const f = FRUITS[level];
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.arc(0, 0, f.r, 0, Math.PI * 2);
    ctx.fillStyle = f.color + 'cc';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(90,58,26,.35)';
    ctx.stroke();
    ctx.rotate(angle || 0);
    ctx.font = Math.round(f.r * 1.35) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';
    ctx.fillText(f.emoji, 0, 2);
    ctx.restore();
  }

  function render() {
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);

    // 警戒線 (快要結束時閃爍)
    ctx.save();
    ctx.setLineDash([10, 8]);
    ctx.lineWidth = 2;
    const warn = overTimer > 0;
    ctx.strokeStyle = warn && Math.floor(now / 200) % 2 ? '#e53935' : 'rgba(229,57,53,.55)';
    ctx.beginPath();
    ctx.moveTo(0, LINE_Y);
    ctx.lineTo(W, LINE_Y);
    ctx.stroke();
    ctx.restore();

    // 預覽水果與導引線
    if (!gameOver) {
      const px = clampX(mouseX, currentLevel);
      ctx.save();
      ctx.setLineDash([4, 6]);
      ctx.strokeStyle = 'rgba(90,58,26,.25)';
      ctx.beginPath();
      ctx.moveTo(px, DROP_Y);
      ctx.lineTo(px, H);
      ctx.stroke();
      ctx.restore();
      const ready = now - lastDrop >= DROP_COOLDOWN;
      drawFruit(px, DROP_Y, currentLevel, 0, ready ? 1 : 0.35);
    }

    // 場上水果
    Matter.Composite.allBodies(world).forEach(function (b) {
      if (b.label === 'fruit') drawFruit(b.position.x, b.position.y, b.level, b.angle, 1);
    });

    // 合成特效
    popEffects = popEffects.filter(function (p) { return now - p.t < 350; });
    popEffects.forEach(function (p) {
      const k = (now - p.t) / 350;
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1 + k * 0.6), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });
  }

  // ---------- 主迴圈 ----------
  let last = performance.now();
  function loop(t) {
    const dt = Math.min(50, t - last);
    last = t;
    if (!gameOver) {
      Engine.update(engine, 1000 / 60);
      processMerges();
      checkGameOver(dt);
    }
    render();
    requestAnimationFrame(loop);
  }

  startGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
